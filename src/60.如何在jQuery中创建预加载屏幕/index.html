<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>60.如何在jQuery中创建预加载屏幕</title>
    <link rel="icon" href="../../static/icon/css2.png">
    <link rel="stylesheet" href="index.css">
    <script src="../../static/js/jquery.js"></script>
</head>
<body>
<div class="preloader">
<div class="loader"></div>
</div>

<script>
    $(window).on('load',function(){
        $('.preloader').addClass('complete')
    })
</script>
</body>
</html>
